<!doctype html>
<html lang="en" data-dir="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3c5d">
  <title>Trier arrival hub — Stegus</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <header>
    <h1>Trier arrival hub <small>Stegus</small></h1>
    <div class="disclaimer">Guidance only — not legal or official advice. Confirm every step with your office.</div>
    <label>Language:
      <select id="lang">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="ar">العربية</option>
      </select>
      <span class="coming-soon" style="font-size:0.8rem;color:#666;margin-left:.5rem">More languages coming soon</span>
    </label>
  </header>
  <main id="app"></main>
  <script>
    const key = (packId, code) => `stegus:${packId}:${code}`;

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function setDirAndLang(lang) {
  const html = document.documentElement;
  html.lang = lang;
  html.dir = lang === 'ar' ? 'rtl' : 'ltr';
}
    function loadProgress(packId, itemCodes) {
      const out = {};
      for (const code of itemCodes) {
        const v = localStorage.getItem(key(packId, code));
        out[code] = v === 'done' ? 'done' : 'not_done';
      }
      return out;
    }
    function saveProgress(packId, code, status) {
      localStorage.setItem(key(packId, code), status);
    }

    async function loadPack(lang) {
      const root = document.getElementById('app');
      root.innerHTML = '';
      try {
        const res = await fetch('./content/packs/trier.json');
        if (!res.ok) throw new Error('Pack not found: ' + res.status);
        const pack = await res.json();
        const codes = pack.blocks.map(b => b.id);
        const progress = loadProgress(pack.pack_id, codes);

        pack.blocks.forEach(b => {
          const card = document.createElement('article');
          card.className = 'card';

          const title = (b.title && typeof b.title === 'object')
            ? (b.title[lang] || b.title.en)
            : b.title;
          const textField = `text_${lang}`;
          const disclaimerField = `disclaimer_${lang}`;
          const disclaimer = b[disclaimerField] || b.disclaimer_en;
          const isDone = progress[b.id] === 'done';

          // Safe rendering (no innerHTML) — fixes W1
          const card = document.createElement('article');
          card.className = 'card';

          const h2 = document.createElement('h2');
          h2.textContent = title + (isDone ? ' ✓' : '');
          card.appendChild(h2);

          const ul = document.createElement('ul');
          b.steps.forEach(s => {
            const li = document.createElement('li');
            li.textContent = s[textField] || s.text_en || '';
            ul.appendChild(li);
          });
          card.appendChild(ul);

          if (disclaimer) {
            const p = document.createElement('p');
            p.className = 'disclaimer';
            p.textContent = disclaimer;
            card.appendChild(p);
          }

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.code = b.id;
          btn.dataset.state = isDone ? 'done' : 'not_done';
          btn.textContent = isDone ? 'Mark undone' : 'Mark done';
          card.appendChild(btn);

          root.appendChild(card);
        });

        root.querySelectorAll('button[data-code]').forEach(btn => {
          btn.addEventListener('click', () => {
            const code = btn.dataset.code;
            const next = btn.dataset.state === 'done' ? 'not_done' : 'done';
            saveProgress(pack.pack_id, code, next);
            loadPack(lang);
          });
        });
      } catch (err) {
        root.innerHTML = `
          <div class="disclaimer" style="color:#b00020">⚠️ Failed to load checklist: ${escapeHtml(err.message)}.</div>
          <button type="button" id="retry-btn">Retry</button>
        `;
        document.getElementById('retry-btn').addEventListener('click', () => loadPack(lang));
      }
    }

    const sel = document.querySelector('#lang');
    sel.addEventListener('change', () => {
      setDirAndLang(sel.value);
      loadPack(sel.value);
    });
    setDirAndLang('en');
    loadPack('en');

    // Register service worker for offline-first PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        // Silent fail — SW is optional enhancement
      });
    }
  </script>
</body>
</html>
